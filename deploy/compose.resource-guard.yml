# Install as docker-compose.override.yml AFTER native quota migration.
services:
  control:
    environment:
      BH_RESOURCE_GUARD: '1'
      BH_MAX_RUNNING_TOOLS: '8'
    mem_limit: 768m
    memswap_limit: 768m
    cpu_shares: 2048
    cpus: 1.0
    pids_limit: 256
    volumes:
      - /run/boathouse-guard:/run/boathouse-guard
      - /var/lib/boathouse/storage:/var/lib/boathouse/storage
  postgres:
    mem_limit: 1g
    memswap_limit: 1g
    cpu_shares: 2048
    cpus: 1.0
    pids_limit: 128
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=80', '-c', 'max_wal_size=256MB', '-c', 'min_wal_size=80MB']
    volumes:
      - /var/lib/boathouse/storage:/boathouse-storage
  caddy:
    mem_limit: 128m
    memswap_limit: 128m
    cpu_shares: 512
    cpus: 0.5
    pids_limit: 128
